<div class="overlay-backdrop" (click)="cancel()">
  <div class="overlay-panel" (click)="$event.stopPropagation()">
    <h2 class="section-title">Invite user</h2>
    <form class="stack" (ngSubmit)="submit()">
      <div class="field">
        <label for="invite-email">Email</label>
        <input id="invite-email" type="email" [(ngModel)]="email" name="email" required />
      </div>

      <div class="field">
        <label for="invite-role">Role</label>
        <select id="invite-role" [(ngModel)]="role" name="role" required>
          <option value="" disabled selected>Select a role</option>
          @for (r of roles(); track r) {
            <option [value]="r">{{ r }}</option>
          }
        </select>
      </div>

      @if (error) {
        <div style="color: var(--danger); font-size: 13px;">{{ error }}</div>
      }

      <div class="form-actions">
        <button class="btn" type="submit" [disabled]="!email || !role">Invite</button>
        <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  </div>
</div>
