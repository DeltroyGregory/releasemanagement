<div class="overlay-backdrop" (click)="cancel()">
  <div class="overlay-panel" (click)="$event.stopPropagation()">
    <h2 class="section-title">Edit user</h2>

    <div class="user-cell" style="margin-bottom: 16px;">
      <div class="avatar" style="width: 44px; height: 44px; font-size: 15px;">{{ initials() }}</div>
      <div>
        <div class="user-name" style="font-size: 15px;">{{ user().userName }}</div>
        <div class="user-email">{{ user().email }}</div>
      </div>
    </div>

    <div class="meta-row">
      <div>
        <div class="meta-label">User ID</div>
        <div class="mono">{{ user().id }}</div>
      </div>
      <div>
        <div class="meta-label">Created</div>
        <div>{{ user().createdAt | date: 'mediumDate' }}</div>
      </div>
    </div>

    <label class="field-label">Role</label>

    @for (r of roles(); track r) {
      <div class="role-option" [class.selected]="selectedRole === r" (click)="selectedRole = r">
        <div class="role-radio">
          @if (selectedRole === r) {
            <div class="role-radio-dot"></div>
          }
        </div>
        <div>
          <div class="role-option-name">{{ r }}</div>
          @if (roleDescription(r)) {
            <div class="role-option-desc">{{ roleDescription(r) }}</div>
          }
        </div>
      </div>
    }

    <div class="form-actions">
      <button class="btn" type="button" (click)="save()">Save</button>
      <button class="btn btn-secondary" type="button" (click)="cancel()">Cancel</button>
    </div>
  </div>
</div>
