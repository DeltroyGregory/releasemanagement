name: Deploy (dev)

on:
  push:
    branches: [development]
  pull_request:
    branches: [development]
    paths:
      - '.devops/terraform/**'
      - '.github/workflows/deploy-dev.yml'

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: .devops/terraform

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    environment: dev
    outputs:
      resource_group_name: ${{ steps.tf_outputs.outputs.resource_group_name }}
      app_service_name: ${{ steps.tf_outputs.outputs.app_service_name }}
      sql_server_name: ${{ steps.tf_outputs.outputs.sql_server_name }}
      sql_server_fqdn: ${{ steps.tf_outputs.outputs.sql_server_fqdn }}
      sql_database_name: ${{ steps.tf_outputs.outputs.sql_database_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=rmp-dev.tfstate"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan

      # Only applies on push to development — pull requests get a plan only, as a review check.
      - name: Terraform apply
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Read outputs
        id: tf_outputs
        if: github.event_name == 'push' && github.ref == 'refs/heads/development'
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "resource_group_name=$(terraform output -raw resource_group_name)" >> "$GITHUB_OUTPUT"
          echo "app_service_name=$(terraform output -raw app_service_name)" >> "$GITHUB_OUTPUT"
          echo "sql_server_name=$(terraform output -raw sql_server_name)" >> "$GITHUB_OUTPUT"
          echo "sql_server_fqdn=$(terraform output -raw sql_server_fqdn)" >> "$GITHUB_OUTPUT"
          echo "sql_database_name=$(terraform output -raw sql_database_name)" >> "$GITHUB_OUTPUT"

  build-and-deploy:
    name: Build & deploy app
    needs: terraform
    if: github.event_name == 'push' && github.ref == 'refs/heads/development'
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      # Azure SQL has no public network path from a hosted runner by default. Open a rule for
      # just this run's IP, do the grant, then close it again.
      - name: Open temporary SQL firewall rule for this runner
        run: |
          RUNNER_IP=$(curl -s https://ifconfig.me)
          echo "RUNNER_IP=$RUNNER_IP" >> "$GITHUB_ENV"
          az sql server firewall-rule create \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --server "${{ needs.terraform.outputs.sql_server_name }}" \
            --name "github-actions-runner-temp" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      - name: Grant the web app's managed identity DB access
        uses: azure/sql-action@v2.3
        with:
          connection-string: "Server=tcp:${{ needs.terraform.outputs.sql_server_fqdn }},1433;Database=${{ needs.terraform.outputs.sql_database_name }};Authentication=Active Directory Default;Encrypt=True;"
          path: .devops/sql/grant-managed-identity.sql
          sqlcmd-variables: WebAppName=${{ needs.terraform.outputs.app_service_name }}

      - name: Remove temporary SQL firewall rule
        if: always()
        run: |
          az sql server firewall-rule delete \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --server "${{ needs.terraform.outputs.sql_server_name }}" \
            --name "github-actions-runner-temp" \
            --yes || true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ClientApp/package-lock.json

      - name: Build Angular
        working-directory: ClientApp
        run: |
          npm ci
          npm run build

      - name: Publish .NET
        run: dotnet publish rmp.csproj -c Release -o publish

      # Matches CLAUDE.md's documented production build steps: Angular's build output goes into
      # the published app's wwwroot/, and Program.cs's static-file fallback serves it.
      - name: Copy Angular build into wwwroot
        run: |
          mkdir -p publish/wwwroot
          cp -r ClientApp/dist/ClientApp/browser/* publish/wwwroot/

      - name: Zip publish output
        run: (cd publish && zip -r ../app.zip .)

      - name: Deploy to Azure Web App
        run: |
          az webapp deploy \
            --resource-group "${{ needs.terraform.outputs.resource_group_name }}" \
            --name "${{ needs.terraform.outputs.app_service_name }}" \
            --src-path app.zip \
            --type zip
