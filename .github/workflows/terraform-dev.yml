name: Terraform (dev)

# Manual only — run from the Actions tab when you're ready to plan/apply. Not triggered by push
# or pull_request; the person running this decides when Terraform touches Azure.
on:
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

env:
  TF_VERSION: "1.9.8"
  TF_WORKING_DIR: .devops/terraform

jobs:
  terraform:
    name: Terraform plan/apply
    runs-on: ubuntu-latest
    environment: dev
    # Terraform authenticates itself directly via these (native OIDC support in the azurerm
    # provider/backend — see providers.tf's use_oidc). It does NOT use an azure/login CLI session:
    # the azurerm provider explicitly refuses to authenticate through a CLI session that was
    # itself established as a service principal, so there's no azure/login step in this job.
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: true
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # Temporary: these are resource names, not secrets, so safe to print — confirms whether
      # TF_STATE_* are actually set on the `dev` GitHub Environment before terraform init runs.
      # Remove once the backend is confirmed working.
      - name: Debug - show resolved backend vars
        run: |
          echo "TF_STATE_RG=[${{ vars.TF_STATE_RG }}]"
          echo "TF_STATE_STORAGE=[${{ vars.TF_STATE_STORAGE }}]"
          echo "TF_STATE_CONTAINER=[${{ vars.TF_STATE_CONTAINER }}]"

      - name: Terraform init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform init \
            -backend-config="resource_group_name=${{ vars.TF_STATE_RG }}" \
            -backend-config="storage_account_name=${{ vars.TF_STATE_STORAGE }}" \
            -backend-config="container_name=${{ vars.TF_STATE_CONTAINER }}" \
            -backend-config="key=rmp-dev.tfstate"

      - name: Terraform plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var-file=dev.tfvars \
            -var="subscription_id=${{ vars.AZURE_SUBSCRIPTION_ID }}" \
            -out=tfplan

      - name: Terraform apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      - name: Show outputs
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform output
